name: Build and Release Parrot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build native system audio helper
        run: |
          mkdir -p src/native/bin
          ARCH="$(uname -m)"
          xcrun swiftc src/native/macos/SystemAudioCapture.swift \
            -parse-as-library -O -target "${ARCH}-apple-macos13.0" \
            -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist \
            -Xlinker src/native/macos/HelperInfo.plist \
            -o src/native/bin/parrot-system-audio
          codesign --force --sign - src/native/bin/parrot-system-audio

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --clean --name "Parrot" --windowed \
            --icon "assets/AppIcon.icns" \
            --add-data "src/ui:src/ui" \
            --add-data "assets:assets" \
            --add-binary "src/native/bin/parrot-system-audio:src/native/bin" \
            --collect-all webview \
            --collect-all sounddevice \
            --collect-all soundfile \
            --collect-all uvicorn \
            main.py

          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string O Parrot usa o microfone para traduzir sua voz." dist/Parrot.app/Contents/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAudioCaptureUsageDescription string O Parrot captura o áudio reproduzido para traduzir falas em tempo real." dist/Parrot.app/Contents/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSScreenCaptureUsageDescription string O Parrot usa a captura do sistema somente para receber áudio." dist/Parrot.app/Contents/Info.plist || true
          codesign --force --deep --sign - dist/Parrot.app

          ditto -c -k --sequesterRsrc --keepParent dist/Parrot.app Parrot-macOS.zip
          mkdir -p dmg_root
          cp -R dist/Parrot.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Parrot" -srcfolder dmg_root -ov -format UDZO "Parrot-macOS.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            Parrot-macOS.dmg
            Parrot-macOS.zip

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Windows Standalone Executable
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "Parrot" `
            --icon "assets/icon.ico" `
            --add-data "src/ui;src/ui" `
            --add-data "assets;assets" `
            --collect-all webview `
            --collect-all sounddevice `
            --collect-all soundfile `
            --collect-all soundcard `
            --collect-all uvicorn `
            main.py
          Compress-Archive -Path dist/Parrot/* -DestinationPath Parrot-Windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: Parrot-Windows-x64.zip

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release_assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Parrot ${{ github.event.inputs.version || github.ref_name }}
          files: |
            release_assets/Parrot-macOS.dmg
            release_assets/Parrot-macOS.zip
            release_assets/Parrot-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
